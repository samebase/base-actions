# Destroys the app: the Workers Builds link, the Convex deploy keys, the
# Worker with its Previews, the Convex project with every deployment and its
# data, and the state of the setup stack in alchemy.run.ts. The repository
# stays. scripts/destroy-app.ts says how and in what order.
#
# Run it from the Actions tab on the default branch with
# `delete <owner>/<repository>` in the confirm field. Another text, another
# branch, or a repository without the CONVEX_TEAM_ID variable fails the run
# before anything is installed, and the error says what to change.
#
# A destroy that ran uploads the destroy receipt as the artifact
# samebase-setup-output (scripts/setup-output.ts), the name of the setup
# output that the deploy in alchemy.yml uploads.
name: Destroy app

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type delete owner/repository, with this repository's owner/repository, to destroy the app: the Worker, the Convex project with all its deployments, and the stack state"
        required: true
        type: string

permissions:
  contents: read

# The concurrency group of .github/workflows/alchemy.yml. Groups are
# repository-wide, so a destroy waits for a running or queued deploy, and a
# deploy queued after the destroy waits for it.
concurrency:
  group: alchemy
  queue: max
  cancel-in-progress: false

# No secrets here: the steps that need them set them.
env:
  CI: "true"
  CONVEX_TEAM_ID: ${{ vars.CONVEX_TEAM_ID }}

jobs:
  destroy-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fails the run instead of skipping the job, so the run says what to
      # change. The input reaches the script only as an environment variable.
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED: delete ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$CONVEX_TEAM_ID" ]; then
            echo "::error::This repository has no CONVEX_TEAM_ID variable, so it has no app to destroy."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on the default branch, $DEFAULT_BRANCH."
            exit 1
          fi
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "::error::Type \"$EXPECTED\" into the confirm field to destroy this app."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      # No install scripts and no credentials, so no dependency code runs with secrets before the audit passes.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The vulnerability audits of the deploy in alchemy.yml protect the
      # deploy, not the cleanup, so a new advisory cannot block a destroy.
      - name: Audit package signatures
        run: pnpm audit signatures

      # A dry run that upgrades the state store, a deploy of the Worker shell
      # and the Convex project with DESTROY_APP=true, `alchemy destroy --stage
      # prod`, then the delete of the stack's state. scripts/destroy-app.ts
      # says why and in what order.
      - name: Destroy the app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
        run: node ./scripts/destroy-app.ts

      # The destroy receipt, which scripts/destroy-app.ts writes only after
      # `alchemy destroy` ran. A stack without state leaves no file.
      - name: Upload the destroy receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samebase-setup-output
          path: samebase-setup-output.json
          if-no-files-found: ignore
          overwrite: true
