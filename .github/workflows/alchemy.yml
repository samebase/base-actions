# Runs the setup stack in alchemy.run.ts. Workers Builds deploys the app on
# every push; this workflow applies only the setup around it.
#
# - Pull request that changes the stack: a plan and a drift report, read-only.
# - Push to main that changes the stack: a deploy that also repairs drift.
# - Run workflow on main: the same deploy, with `adopt` for resources that
#   exist but are not in the state yet.
#
# A deploy uploads the artifact samebase-setup-output: the ids of the Worker
# and the Convex project for Samebase, never a secret (scripts/setup-output.ts).
# The Destroy app workflow (destroy.yml) destroys the app and uploads its
# destroy receipt under the same name.
#
# Each job installs without lifecycle scripts and audits the packages before
# any credential is in use. The jobs skip a repository without the
# CONVEX_TEAM_ID variable, such as the published copy of this template.
name: alchemy

on:
  pull_request:
    paths:
      - alchemy.run.ts
      - scripts/deploy-names.ts
      - scripts/setup-output.ts
      - scripts/publish-setup-output.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/alchemy.yml
  push:
    branches: [main]
    paths:
      - alchemy.run.ts
      - scripts/deploy-names.ts
      - scripts/setup-output.ts
      - scripts/publish-setup-output.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/alchemy.yml
  workflow_dispatch:
    inputs:
      adopt:
        description: "Adopt resources that exist but are not in the state yet"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time. Pending runs wait instead of replacing each other, so a
# pull request plan never drops a queued deploy. The Destroy app workflow
# (destroy.yml) uses this group too, so a destroy waits for a running or queued
# deploy.
concurrency:
  group: alchemy
  queue: max
  cancel-in-progress: false

# No secrets here: the steps that need them set them.
env:
  CI: "true"
  CONVEX_TEAM_ID: ${{ vars.CONVEX_TEAM_ID }}

jobs:
  plan:
    # A repository without the deploy setup, such as the published copy of
    # this template, has no CONVEX_TEAM_ID variable and no secrets, so it
    # skips the jobs. An unset variable is an empty string.
    if: vars.CONVEX_TEAM_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      # No install scripts and no credentials, so no dependency code runs with secrets before the audits pass.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

      # Read-only. The stack reads the GitHub ids and the default branch of
      # this repository from the GitHub API.
      - name: Plan the stack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec alchemy plan --stage prod --no-input --detailed

      # Read-only: reports resources that changed outside the stack.
      - name: Report drift
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec alchemy drift --stage prod --no-input

  deploy:
    # A push to main, or a run of the workflow on the default branch. Skipped
    # without CONVEX_TEAM_ID, like the plan.
    if: vars.CONVEX_TEAM_ID != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The head of the branch, not the commit of the run: a rerun of an older
      # run, or a run that waited behind a newer push, applies the newest stack
      # instead of an older one.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      # No install scripts and no credentials, so no dependency code runs with secrets before the audits pass.
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

      # The deploy that creates the Workers Builds link also starts the first
      # production build (FirstBuild in alchemy.run.ts): Samebase pushes the
      # starter before this workflow creates the link, so no push builds it.
      - name: Deploy the stack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec alchemy deploy --stage prod --yes --no-input --detect-drift ${{ inputs.adopt && '--adopt' || '' }}

      # Reads the stack output of the deploy above and writes its checked
      # samebase value to samebase-setup-output.json.
      - name: Write the setup output for Samebase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ./scripts/publish-setup-output.ts

      # A rerun of this run replaces the artifact of the earlier attempt.
      - name: Upload the setup output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samebase-setup-output
          path: samebase-setup-output.json
          if-no-files-found: error
          overwrite: true
